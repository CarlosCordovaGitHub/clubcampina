# Stack completo para despliegue (servidor propio del club o similar).
# Solo `web` (Nginx) expone puerto público; el resto vive en la red interna.
# Requiere un archivo .env junto a este compose (ver .env.prod.example).
# `name` distinto al compose de desarrollo para no compartir volúmenes/red.
name: campina-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [interna]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  vision-engine:
    build: ./servidor/vision-engine
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./servidor
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      VISION_ENGINE_URL: http://vision-engine:8000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      UPLOADS_DIR: ./uploads
    volumes:
      - uploads:/app/uploads
    networks: [interna]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vision-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/v1/zonas').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: app/web/Dockerfile
    ports:
      - "${PUERTO_PUBLICO:-80}:80"
    networks: [interna]
    depends_on:
      api:
        condition: service_healthy

networks:
  interna:

volumes:
  pgdata:
  uploads:
