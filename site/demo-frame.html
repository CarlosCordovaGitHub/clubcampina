<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampiñaAccess — Demo</title>
<style>
  :root{
    --navy-dark:#00263d;
    --navy:#003a5d;
    --sky:#0078c0;
    --gold:#c99a3b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Segoe UI",Calibri,Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(0,120,192,0.32), transparent 60%),
      radial-gradient(700px 460px at 105% 10%, rgba(201,154,59,0.2), transparent 55%),
      linear-gradient(160deg,var(--navy-dark) 0%,var(--navy) 55%,#012f4d 100%);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .back{
    position:fixed;
    left:24px;top:50%;transform:translateY(-50%);
    display:inline-flex;align-items:center;gap:7px;
    color:#dbe9f3;text-decoration:none;font-size:13px;font-weight:600;
    padding:9px 16px 9px 12px;border-radius:999px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    z-index:5;
    white-space:nowrap;
  }
  .back:hover{background:rgba(255,255,255,0.14);}
  .back svg{width:14px;height:14px;flex:none;}
  .stage{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px 16px;
  }

  /* --- marco de teléfono, delgado y recto (estilo Android grande) --- */
  .device{
    position:relative;
    width:412px;
    height:min(910px, 94vh);
    background:#111417;
    border-radius:30px;
    padding:5px;
    box-shadow:0 26px 60px rgba(0,10,25,0.55), 0 0 0 1.5px rgba(255,255,255,0.08) inset;
  }
  .punch{
    position:absolute;
    top:16px;left:50%;transform:translateX(-50%);
    width:10px;height:10px;border-radius:50%;
    background:#111417;
    border:1.5px solid #2a2f34;
    z-index:3;
  }
  .screen{
    width:100%;height:100%;
    border-radius:24px;
    overflow:hidden;
    background:#fff;
    display:flex;
    flex-direction:column;
  }

  .screen iframe{
    flex:1;
    width:100%;
    border:0;display:block;
  }
  .hint{
    position:fixed;
    right:28px;top:50%;transform:translateY(-50%);
    color:#9fb7c8;
    font-size:12px;
    line-height:1.6;
    text-align:left;
    max-width:190px;
    z-index:5;
  }

  /* pantallas medianas: el texto lateral no cabe sin chocar con el marco */
  @media (max-width:900px){
    .hint{display:none;}
  }

  /* --- en celular real: sin marco, pantalla completa --- */
  @media (max-width:500px){
    body{background:#fff;}
    .back{
      top:auto;bottom:auto;transform:none;
      left:12px;top:10px;
      padding:8px 12px 8px 10px;
      background:rgba(0,38,61,0.55);
    }
    .stage{padding:0;}
    .device{
      width:100vw;height:100vh;height:100dvh;
      border-radius:0;padding:0;box-shadow:none;background:transparent;
    }
    .punch{display:none;}
    .screen{border-radius:0;height:100vh;height:100dvh;}
    .hint{display:none;}
  }
</style>
</head>
<body>
  <a class="back" href="./">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
    Volver al portal
  </a>
  <div class="stage">
    <div class="device">
      <div class="punch"></div>
      <div class="screen">
        <iframe src="./demo/" title="CampiñaAccess — demo"></iframe>
      </div>
    </div>
  </div>
  <div class="hint">Vista simulada en un celular Android grande — en tu propio celular, el demo se abre a pantalla completa.</div>
</body>
</html>
